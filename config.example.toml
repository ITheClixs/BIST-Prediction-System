[data]
tcmb_api_key = ""
fetch_retries = 3
rate_limit_delay = 1.0

[signals]
min_confidence = 0.70
lookback_days = 30

[models]
retrain_interval = "monthly"
ensemble_weights = "learned"
active_models = "xgboost,lightgbm"
include_neural = false
seq_len = 30
validation_fraction = 0.2

[quant]
hmm_states = 3
kelly_fraction = 0.25
hurst_window = 252

[backtest]
commission = 0.001
slippage = 0.0005

[research]
experiment_scope = "fixed_bist_large_cap_prototype"
enabled_feature_families = ["stationary_price", "cross_sectional", "temporal"]
accepted_models = [
  "zero_return",
  "majority_direction",
  "previous_return",
  "market_direction",
  "rolling_mean",
  "logistic",
  "ridge",
]
