schema_version: 3
scope: fixed_bist_large_cap_prototype
evidence_run: runs/20260810T230615Z-d346031-2a71b8
status_definitions:
  implemented: "Executable code exists; partial identifies an incomplete contract."
  integrated: "The component participates in the accepted benchmark or accepted prediction lifecycle."
  evaluated: "Committed empirical evidence exists beyond construction, shape, or serialization tests."
  production_inference: "The component is used by an unattended production-style inference service."
  accepted_default: "The component satisfies the current benchmark methodology and is accepted."

