[project]
name = "bist-predict"
version = "0.1.0"
description = "Leakage-controlled benchmark for a fixed BIST large-cap prototype universe"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "yfinance>=0.2",
    "feedparser>=6.0",
    "tomli>=2.0; python_version < '3.11'",
    "numpy>=1.26",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "hmmlearn>=0.3",
    "arch>=7.0",
    "PyWavelets>=1.5",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "torch>=2.2",
    "pandas>=2.1",
    "pyarrow>=18.0",
]

[project.scripts]
bist-predict = "bist_predict.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bist_predict"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "bist_predict.cli",
    "bist_predict.features.engine",
    "bist_predict.models.*",
    "bist_predict.quant.*",
    "bist_predict.research.boosting_search",
    "bist_predict.research.ensemble_pipeline",
]
ignore_errors = true

[tool.coverage.run]
branch = true
source = ["bist_predict"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75

[dependency-groups]
dev = [
    "coverage>=7.9",
    "maturin>=1.9",
    "mypy>=1.16",
    "pre-commit>=4.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.12",
]
