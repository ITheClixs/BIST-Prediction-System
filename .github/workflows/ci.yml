name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  quality:
    name: Lint, format, and type contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src

  python-tests:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - name: Test without extension-specific cases
        run: >-
          uv run coverage run -m pytest -q
          --ignore=tests/test_features/test_rust_correlations.py
          --ignore=tests/test_features/test_rust_equivalence.py
          --ignore=tests/test_features/test_rust_indicators.py
          --ignore=tests/test_features/test_rust_patterns.py
          --ignore=tests/test_research/test_rust_benchmark.py
      - run: uv run coverage report

  research-invariants:
    name: Research invariants and synthetic E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync --locked --all-groups
      - run: make research-invariants
      - name: Create and replay bounded benchmark
        shell: bash
        run: |
          make reproduce-smoke RUNS_ROOT="$RUNNER_TEMP/runs"
          run_id="$(find "$RUNNER_TEMP/runs" -mindepth 1 -maxdepth 1 -type d -exec basename {} \;)"
          make reproduce RUN_ID="$run_id" RUNS_ROOT="$RUNNER_TEMP/runs"

  rust:
    name: Rust tests and Python equivalence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync --locked --all-groups
      - run: uv run maturin develop --release --manifest-path rust/bist_features/Cargo.toml
      - run: cargo test --workspace
      - run: >-
          uv run pytest -q
          tests/test_features/test_rust_correlations.py
          tests/test_features/test_rust_equivalence.py
          tests/test_features/test_rust_indicators.py
          tests/test_features/test_rust_patterns.py
          tests/test_research/test_rust_benchmark.py
