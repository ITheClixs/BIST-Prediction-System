name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  quality:
    name: Lint, format, and type contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src

  python-tests:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - name: Unit tests
        # Cases needing the optional Rust extension skip themselves here and
        # run in the dedicated rust job below.
        run: uv run coverage run -m pytest -q
      - run: uv run coverage report

  research-invariants:
    name: Research invariants and synthetic E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync --locked --all-groups
      - run: make research-invariants
      - name: Document claims match the committed artifacts
        run: make doc-checks RUN_ID=20260809T233545Z-716d379-2a71b8
      - name: Guarded defects are actually detected
        run: make mutation-check
      - name: Create and replay bounded benchmark
        shell: bash
        run: |
          make reproduce-smoke RUNS_ROOT="$RUNNER_TEMP/runs"
          run_id="$(find "$RUNNER_TEMP/runs" -mindepth 1 -maxdepth 1 -type d -exec basename {} \;)"
          make reproduce RUN_ID="$run_id" RUNS_ROOT="$RUNNER_TEMP/runs"
      - name: Replay committed provider-backed benchmark
        run: make reproduce-committed

  rust:
    name: Rust tests and Python equivalence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync --locked --all-groups
      - name: Build the extension from its own crate directory
        run: cd rust/bist_features && uv run --project ../.. maturin develop --release
      - run: cargo test --workspace
      - run: >-
          uv run pytest -q
          tests/test_features/test_rust_correlations.py
          tests/test_features/test_rust_equivalence.py
          tests/test_features/test_rust_indicators.py
          tests/test_features/test_rust_patterns.py
          tests/test_research/test_rust_benchmark.py
